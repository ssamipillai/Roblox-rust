name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rojo
        uses: ok-nick/setup-rojo@v1.1.2
      - name: Build Place
        run: rojo build default.project.json -o build.rbxl
